services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: redome-cz-web:dev
    user: node
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace:cached
      # Anonymní volume drží node_modules uvnitř kontejneru kvůli rychlosti
      # (jinak je sdílení přes bind mount na macOS/Windows velmi pomalé)
      - node_modules:/workspace/node_modules
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - IN_CONTAINER=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  # Agent-browser pro screenshoty / vizuální kontrolu UI.
  # Pouští se na vyžádání přes `make screenshot URL=/cesta`.
  # Připojuje se na dev server přes host.docker.internal (Mac/Windows)
  # nebo přes interní docker síť.
  browser:
    build:
      context: .
      dockerfile: .devcontainer/browser.Dockerfile
    image: redome-cz-browser:dev
    profiles: ["tools"]
    # host.docker.internal funguje napříč Mac/Win Docker Desktop, Linuxem
    # (host-gateway) i GitHub Codespaces – browser tedy vždy míří na
    # http://host.docker.internal:4321, kde je vystavený dev server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./screenshots:/work/screenshots
      - browser_cache:/home/node/.cache/agent-browser

volumes:
  node_modules:
  browser_cache:
