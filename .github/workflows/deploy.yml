name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  # gh api (detect job) i actions/download-artifact (deploy job) s cross-run
  # přístupem potřebují číst metadata jiných workflow runů.
  actions: read
  contents: read

concurrency:
  # Per-target: nahled deploye a www deploye se mezi sebou nevzdají,
  # ale dva nahled deploye v řadě se postaví do fronty (cancel-in-progress
  # false = neosekáme swap uprostřed).
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Detekce: prošlo CI a existuje deploy artifact? Pokud ano, který target?
  # --------------------------------------------------------------------------
  detect:
    name: Detekce deploy targetu
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      target: ${{ steps.find.outputs.target }}
    steps:
      - name: Najdi deploy-* artifact z CI runu
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAMES=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '.artifacts[].name')
          TARGET=$(echo "$NAMES" | sed -n 's/^deploy-\(.*\)$/\1/p' | head -n 1)
          if [[ -n "$TARGET" ]]; then
            echo "✓ Deploy target: $TARGET"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  Žádný deploy-* artifact – přeskakuji deploy."
          fi

  # --------------------------------------------------------------------------
  # Deploy: download artifactu z CI runu + atomic FTPS swap.
  # --------------------------------------------------------------------------
  deploy:
    name: FTPS deploy (${{ needs.detect.outputs.target }})
    needs: detect
    if: needs.detect.outputs.target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wedos

    env:
      BRANCH: ${{ needs.detect.outputs.target }}

    steps:
      - name: Checkout (jen cli/deploy.sh)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            cli
          sparse-checkout-cone-mode: false

      - name: Download dist/
        uses: actions/download-artifact@v5
        with:
          name: deploy-${{ needs.detect.outputs.target }}
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy via cli/deploy.sh
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_PATH: ${{ vars.FTP_PATH }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CI: 'true'
        run: bash cli/deploy.sh
