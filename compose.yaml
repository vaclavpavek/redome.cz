services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    user: node
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace:cached
      # Anonymní volume drží node_modules uvnitř kontejneru kvůli rychlosti
      # (jinak je sdílení přes bind mount na macOS/Windows velmi pomalé)
      - node_modules:/workspace/node_modules
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - IN_CONTAINER=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Zákaz Astro telemetrie (https://astro.build/telemetry) – nesbíráme
      # anonymní statistiky používání, vývoj je čistě lokální.
      - ASTRO_TELEMETRY_DISABLED=1
      # Absolutní URL webu (canonical, OG, sitemap, robots).
      # CI nastaví (jméno větve = subdoména):
      #   nahled → SITE_URL=https://nahled.redome.cz (stage)
      #   www    → SITE_URL=https://www.redome.cz (default, dá se vynechat)
      # Lokálně přepiš: `SITE_URL=http://localhost:4321 make build`
      - SITE_URL=${SITE_URL:-https://www.redome.cz}

  # Mailpit – zachytává všechny e-maily během vývoje (SMTP + webové UI)
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025" # webové UI: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # PHP-CLI server pro lehké backend endpointy (kontaktní formulář).
  # `mail()` posílá přes msmtp na mailpit:1025; v produkci jde to samé
  # PHP do public/ a Apache si ho obslouží sám.
  php:
    build:
      context: .
      dockerfile: .devcontainer/php.Dockerfile
    restart: unless-stopped
    volumes:
      - ./public:/var/www
    depends_on:
      - mailpit
    environment:
      - CONTACT_TO=redome@redome.cz

  # Agent-browser pro screenshoty / vizuální kontrolu UI.
  # Pouští se na vyžádání přes `make screenshot URL=/cesta`.
  # Připojuje se na dev server přes host.docker.internal (Mac/Windows)
  # nebo přes interní docker síť.
  browser:
    build:
      context: .
      dockerfile: .devcontainer/browser.Dockerfile
    profiles: ["tools"]
    # host.docker.internal funguje napříč Mac/Win Docker Desktop, Linuxem
    # (host-gateway) i GitHub Codespaces – browser tedy vždy míří na
    # http://host.docker.internal:4321, kde je vystavený dev server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./screenshots:/work/screenshots
      - browser_cache:/home/node/.cache/agent-browser

volumes:
  node_modules:
  browser_cache:
